name: Build AxoShader ZIP

on:
  push:
    paths:
      - 'shaders/**'
      - 'README.md'
      - 'pack.mcmeta'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package shader pack
        run: |
          mkdir -p dist
          zip -r dist/AxoShader.zip shaders pack.mcmeta
      - uses: actions/upload-artifact@v4
        with:
          name: AxoShader
          path: dist/AxoShader.zip
